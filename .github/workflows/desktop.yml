# Builds the desktop app (Windows, macOS, Linux) and uploads each as a downloadable artifact.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.9.0.
name: Desktop build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win zip --x64
            name: windows
          - os: macos-latest
            target: --mac zip --universal
            name: macos
          - os: ubuntu-latest
            target: --linux tar.gz --x64
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the game
        run: |
          npm ci
          npm run desktop:web
      - name: Package the desktop app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npx electron-builder ${{ matrix.target }} --publish never -c.win.signAndEditExecutable=true
      - uses: actions/upload-artifact@v4
        with:
          name: world-order-${{ matrix.name }}
          path: |
            desktop/release/*.zip
            desktop/release/*.tar.gz
          if-no-files-found: error
