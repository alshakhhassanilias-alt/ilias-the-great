<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Learn German from A1 to B2: every word and rule taught first, then practised with spaced repetition."><meta name="theme-color" content="#10131A"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Wortwerk"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Wortwerk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..900&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column, like a transit app. A departure board on top, the course drawn as a U-Bahn line map. */
:root{
  --bg:#ECEEF3; --card:#FFFFFF; --sunk:#E1E4EB; --ink:#10131A; --mute:#586172; --line:#D3D8E2;
  --accent:#FFCE00; --accent-ink:#10131A; --board:#10131A; --board-ink:#F4F5F8; --board-mute:#9AA3B5;
  --good:#16864A; --good-bg:#DDF3E6; --bad:#C92F25; --bad-bg:#FBE1DE;
  --u1:#1F9D55; --u2:#E2600F; --u3:#1F6FD6; --u4:#8A3FD1;
  --der:#1F6FD6; --die:#C92F25; --das:#16864A;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C0F15; --card:#161A24; --sunk:#1E2330; --ink:#F1F3F8; --mute:#98A2B5; --line:#2A3142;
  --board:#1B2030; --board-ink:#F4F5F8; --board-mute:#9AA3B5;
  --good:#3FCB82; --good-bg:#12301F; --bad:#FF7468; --bad-bg:#3A1714;
  --u1:#34C272; --u2:#FF8235; --u3:#5A9DF5; --u4:#B57BF0;
  --der:#5A9DF5; --die:#FF7468; --das:#3FCB82; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0C0F15; --card:#161A24; --sunk:#1E2330; --ink:#F1F3F8; --mute:#98A2B5; --line:#2A3142;
  --board:#1B2030; --board-ink:#F4F5F8; --board-mute:#9AA3B5;
  --good:#3FCB82; --good-bg:#12301F; --bad:#FF7468; --bad-bg:#3A1714;
  --u1:#34C272; --u2:#FF8235; --u3:#5A9DF5; --u4:#B57BF0;
  --der:#5A9DF5; --die:#FF7468; --das:#3FCB82; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--u3);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--display);font-stretch:112%;font-weight:800;letter-spacing:-.01em;line-height:1.1;text-wrap:balance}
h1{font-size:1.9rem} h2{font-size:1.35rem} h3{font-size:1.05rem}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.wrap.focus{padding-block:14px 32px}
.lab{font:500 .72rem/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.mute{color:var(--mute)} .small{font-size:.875rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .sp{flex:1}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;gap:10px}
.mark{font:900 1.3rem/1 var(--display);font-stretch:125%;letter-spacing:-.02em}
.mark i{font-style:normal;background:var(--accent);color:var(--accent-ink);padding:2px 6px;border-radius:5px;margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font:500 .78rem/1 var(--mono)}
.chip b{font-weight:500;color:var(--mute)}
.roundel{display:inline-grid;place-items:center;min-width:34px;height:24px;padding:0 6px;border-radius:6px;font:500 .78rem/1 var(--mono);color:#fff;background:var(--lc,var(--u1))}
.A1{--lc:var(--u1)} .A2{--lc:var(--u2)} .B1{--lc:var(--u3)} .B2{--lc:var(--u4)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-family:var(--display);font-stretch:112%;font-weight:800;font-size:1.05rem;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.pri:active{box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000);transform:translateY(2px)}
.btn.wide{width:100%} .btn.sm{min-height:38px;padding:0 12px;font-size:.875rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:transparent}
.back{font:500 .8rem/1 var(--mono);color:var(--mute);padding:8px 0;align-self:flex-start}

/* departure board */
.board{background:var(--board);color:var(--board-ink);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.board .lab{color:var(--accent)}
.board h1{font-size:1.7rem}
.board .dest{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brow{display:flex;gap:18px;flex-wrap:wrap;font:500 .82rem/1.3 var(--mono);color:var(--board-mute)}
.brow b{color:var(--board-ink);font-weight:500}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.bar{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden;display:flex}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s}
.bar.seg{gap:3px;background:none} .bar.seg>span{flex:1;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar.seg>span>i{display:block;height:100%;background:var(--lc)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week span{font:500 .68rem/1 var(--mono);color:var(--mute);display:flex;flex-direction:column;gap:6px;align-items:center}
.week i{width:100%;max-width:38px;aspect-ratio:1;border-radius:9px;background:var(--sunk);display:block}
.week i.some{background:color-mix(in srgb,var(--accent) 45%,var(--sunk))} .week i.hit{background:var(--accent)}
.week .now{color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile b{font-family:var(--display);font-stretch:112%;font-weight:800;overflow-wrap:anywhere;hyphens:auto}
.tile span{font-size:.82rem;color:var(--mute)}
.tile[disabled]{opacity:.5}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center;pointer-events:none;z-index:5}
#nav div{pointer-events:auto;display:flex;gap:2px;background:var(--board);border-radius:16px;padding:5px;box-shadow:0 8px 28px rgba(0,0,0,.28);max-width:100%}
#nav button{color:var(--board-mute);font:600 .8rem/1 var(--body);padding:12px 13px;border-radius:12px}
#nav button.on{background:var(--accent);color:var(--accent-ink)}

/* line map */
.linehd{display:flex;align-items:center;gap:10px;margin-top:6px}
.stops{display:flex;flex-direction:column;position:relative;padding-left:30px}
.stops:before{content:"";position:absolute;left:10px;top:18px;bottom:18px;width:5px;border-radius:9px;background:var(--lc)}
.stop{position:relative;display:flex;align-items:center;gap:12px;text-align:left;padding:11px 12px;border-radius:12px;width:100%}
.stop:hover{background:var(--card)}
.stop:before{content:"";position:absolute;left:-27.5px;top:50%;width:14px;height:14px;margin-top:-10px;border-radius:50%;background:var(--bg);border:3px solid var(--lc)}
.stop.done:before{background:var(--lc)} .stop.cur:before{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 80%,transparent);background:var(--accent);border-color:var(--ink)}
.stop .t{flex:1;min-width:0} .stop .t b{display:block;font-family:var(--display);font-stretch:112%;font-weight:800}
.stop .t span{font-size:.82rem;color:var(--mute)}
.stop .num{font-size:.78rem;color:var(--mute)}
.gram{gap:10px} .gram li{margin-left:18px;padding-left:2px} .gram ul{margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.gram b{background:color-mix(in srgb,var(--accent) 38%,transparent);padding:0 2px;border-radius:4px;font-weight:600;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sent{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.sent:first-of-type{border-top:0}
.sent div{flex:1;min-width:0} .sent small{color:var(--mute);display:block}
.pips{display:flex;gap:2px;margin-top:8px} .pips i{width:7px;height:7px;border-radius:2px;background:var(--sunk)} .pips i.f{background:var(--good)}
.spk{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.spk svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ride */
.ridebar{display:flex;align-items:center;gap:12px}
.ridebar .bar{flex:1} .x{font:500 1.3rem/1 var(--mono);color:var(--mute);width:38px;height:38px}
.combo{font:500 .78rem/1 var(--mono);background:var(--accent);color:var(--accent-ink);padding:6px 9px;border-radius:8px}
.ex{display:flex;flex-direction:column;gap:18px;padding-top:8px}
.de{font-family:var(--display);font-stretch:108%;font-weight:700;font-size:1.5rem;line-height:1.3;overflow-wrap:anywhere}
.en{color:var(--mute);font-size:1.02rem}
.prompt{font-family:var(--display);font-weight:700;font-size:1.35rem;line-height:1.3}
.gap{display:inline-block;min-width:74px;border-bottom:3px solid var(--ink);text-align:center;padding:0 6px;color:var(--good)}
.gap.bad{color:var(--bad)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-weight:600;font-size:1.1rem;text-align:left}
.opt kbd{font:500 .72rem/1 var(--mono);color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:4px 6px}
.opt.ok{border-color:var(--good);background:var(--good-bg)} .opt.no{border-color:var(--bad);background:var(--bad-bg)}
.slot{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding-bottom:10px;align-content:flex-start}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.tk{padding:10px 13px;border-radius:10px;background:var(--card);border:1.5px solid var(--line);font-weight:600;box-shadow:0 2px 0 var(--line)}
.tk.used{visibility:hidden}
.inp{width:100%;min-height:54px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:1.1rem}
textarea.inp{resize:vertical;min-height:90px}
.inp:focus{outline:none;border-color:var(--ink)}
.uml{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.uml button{min-width:40px;height:38px;border-radius:9px;background:var(--sunk);font-weight:600}
.mic.on{background:var(--bad);color:#fff}
.bigplay{width:84px;height:84px;border-radius:24px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.bigplay svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fb{border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--good-bg);border:1.5px solid var(--good);animation:rise .18s ease-out}
.fb.no{background:var(--bad-bg);border-color:var(--bad)}
.fb h3{color:var(--good)} .fb.no h3{color:var(--bad)}
.fb .ans{font-weight:600;font-size:1.08rem;overflow-wrap:anywhere}
.why{background:var(--card);border-radius:10px;padding:10px 12px;font-size:.92rem;white-space:pre-wrap}
@keyframes rise{from{transform:translateY(8px);opacity:.4}}
.center{align-items:center;text-align:center}
.hero-n{font:900 3.6rem/1 var(--display);font-stretch:125%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.stats.four{grid-template-columns:repeat(2,1fr)}
@media (min-width:600px){.stats.four{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font:800 1.5rem/1.1 var(--display);font-stretch:112%}
.stat span{font-size:.78rem;color:var(--mute)}
.chart{display:flex;align-items:flex-end;gap:4px;height:90px}
.chart i{flex:1;background:var(--sunk);border-radius:4px 4px 0 0;min-height:3px}
.chart i.hit{background:var(--accent)} .chart i.some{background:color-mix(in srgb,var(--accent) 45%,var(--sunk))}

/* games */
.noun{font:900 clamp(2rem,9vw,3.4rem)/1.1 var(--display);font-stretch:118%;overflow-wrap:anywhere}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.g3 button{min-height:72px;border-radius:14px;color:#fff;font:800 1.3rem/1 var(--display);font-stretch:112%}
.g3 .r{background:var(--der)} .g3 .e{background:var(--die)} .g3 .s{background:var(--das)}
.flash{font-weight:600;min-height:1.6em}
.flash.ok{color:var(--good)} .flash.no{color:var(--bad)}
.r-c{color:var(--der)} .e-c{color:var(--die)} .s-c{color:var(--das)}

/* tutor */
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.them{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:5px}
.msg.me{background:var(--board);color:var(--board-ink);align-self:flex-end;border-bottom-right-radius:5px}
.note{align-self:flex-end;max-width:88%;font-size:.86rem;background:color-mix(in srgb,var(--accent) 22%,var(--card));border-radius:10px;padding:8px 12px;white-space:pre-wrap}
.msgact{align-self:flex-start;display:flex;gap:8px}
.send{display:flex;flex-direction:column;gap:8px;position:sticky;bottom:0;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.story{font-size:1.12rem;line-height:1.7;white-space:pre-wrap}
.gloss{display:flex;flex-wrap:wrap;gap:6px} .gloss span{background:var(--sunk);border-radius:8px;padding:4px 9px;font-size:.85rem}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ink);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(1turn)}}
.seg-ctl{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px}
.seg-ctl button{padding:8px 12px;border-radius:8px;font-weight:600;font-size:.875rem}
.seg-ctl button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--board);color:var(--board-ink);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;transition:.2s;pointer-events:none;z-index:9;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.cf{position:fixed;left:50%;top:38%;width:10px;height:10px;border-radius:2px;pointer-events:none;z-index:8;animation:cf 1s ease-out forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--rt));opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (min-width:560px){.opts.h{grid-template-columns:repeat(3,1fr)}}

/* ===== v2 additions ===== */
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.g-r{color:var(--der)} .g-e{color:var(--die)} .g-s{color:var(--das)} .g-p{color:var(--ink)}
.art{font-weight:500;opacity:.85}
.bmute{color:var(--board-mute)}
.tbar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--board-ink) 16%,transparent);overflow:hidden}
.tbar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.pill{display:inline-flex;align-items:center;font:500 .72rem/1 var(--mono);padding:5px 8px;border-radius:99px;background:var(--sunk);color:var(--mute);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--bad-bg);color:var(--bad)} .pill.ghost{background:transparent;border:1px solid var(--line)}
.ck{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.ck li{display:flex;gap:12px;align-items:flex-start}
.ck li div{display:flex;flex-direction:column;min-width:0} .ck li span:not(.box){font-size:.84rem;color:var(--mute)}
.box{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;margin-top:1px}
.box svg{width:14px;height:14px;stroke-width:3}
.ck li.done .box,.pk.on .box{background:var(--good);border-color:var(--good);color:#fff}
.ck li.done b{text-decoration:line-through;text-decoration-color:var(--mute);color:var(--mute)}
.dots{display:flex;gap:6px} .dots i{width:28px;height:5px;border-radius:9px;background:var(--sunk)} .dots i.on{background:var(--accent)}
.pickl{display:flex;flex-direction:column;gap:10px}
.pk{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-weight:600;min-height:56px}
.pk.on{border-color:var(--good)}
.pk.big{flex-direction:column;align-items:flex-start;gap:4px}
.pk.big b{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:1.1rem} .pk.big span{font-weight:400;color:var(--mute);font-size:.9rem}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.facts div{display:flex;flex-direction:column;gap:2px} .facts b{font:800 1.6rem/1 var(--display);font-stretch:112%} .facts span{font-size:.82rem;color:var(--mute)}
.goodc{border-color:var(--good);background:color-mix(in srgb,var(--good-bg) 60%,var(--card))}
.warnc{border-color:color-mix(in srgb,var(--accent) 70%,var(--line));background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.card p{margin:0} .card b{font-weight:600}
.seg-ctl.wide{display:flex;width:100%} .seg-ctl.wide button{flex:1;padding:10px 4px}
.inp.sm{min-height:38px;padding:6px 10px;font-size:.9rem;width:auto}
.btn.danger{color:var(--bad);border-color:var(--bad)}
a.btn{text-decoration:none;color:inherit;align-self:flex-start}
/* teaching card */
.wcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px;border-top:6px solid var(--line)}
.wcard.g-r{border-top-color:var(--der)} .wcard.g-e{border-top-color:var(--die)} .wcard.g-s{border-top-color:var(--das)}
.wcard{color:var(--ink)}
.big{font:800 clamp(1.8rem,8vw,2.6rem)/1.1 var(--display);font-stretch:112%;overflow-wrap:anywhere;min-width:0}
.big2{font-family:var(--display);font-stretch:108%;font-weight:800;font-size:1.7rem;line-height:1.2;overflow-wrap:anywhere}
.mean{font-size:1.25rem;font-weight:600}
.exl{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border-radius:12px;padding:10px 12px}
.exl>div{min-width:0} .de2{font-weight:600}
.spk.lg{width:48px;height:48px;border-radius:14px} .spk.lg svg{width:22px;height:22px}
/* lessons */
.lessonc{display:flex;flex-direction:column;gap:12px}
.lessonc h2{font-size:1.3rem;margin-top:4px}
.lessonc p{line-height:1.6}
.lessonc hr{border:0;border-top:1px dashed var(--line);margin:8px 0;width:100%}
.lessonc b{background:color-mix(in srgb,var(--accent) 38%,transparent);padding:0 3px;border-radius:4px;font-weight:600;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.tbl table{border-collapse:collapse;width:100%;font-size:.95rem}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0} .tbl td+td{border-left:1px solid var(--line)}
.tip{background:color-mix(in srgb,var(--u3) 12%,var(--card));border-left:4px solid var(--u3);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.qcheck{border:1.5px dashed var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.qcheck .gap{min-width:56px}
/* course */
.stop .kind{font:500 .66rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);display:block;margin-bottom:3px}
.stop.small .t b{font-size:.95rem}
.stop.small:before{width:10px;height:10px;left:-25.5px;margin-top:-8px;border-width:2.5px}
.stop.check{border:1.5px dashed var(--line);margin-top:4px}
.stop.check:before{border-radius:4px;transform:rotate(45deg)}
/* words */
.wlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.wrow+.wrow{border-top:1px solid var(--line)}
.wbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px}
.wde{font-weight:600;flex:1 1 45%;min-width:0;overflow-wrap:anywhere} .wen{flex:1 1 40%;min-width:0;color:var(--mute);font-size:.9rem}
.wdet{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.wrow.open{background:color-mix(in srgb,var(--accent) 6%,var(--card))}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
#wres{display:flex;flex-direction:column;gap:8px}
.prow .t{flex:1;min-width:0;display:flex;flex-direction:column} .prow .t b{font-family:var(--display);font-stretch:108%;font-weight:800} .prow .t span{font-size:.8rem;color:var(--mute)}
.pbar{width:70px;height:6px;background:var(--sunk);border-radius:9px;overflow:hidden;flex:none} .pbar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.skill{display:grid;grid-template-columns:minmax(0,1fr) 90px 44px;gap:10px;align-items:center;font-size:.92rem}
.skill .pbar{width:100%} .pbar i.lo{background:var(--bad)} .pbar i.mid{background:var(--accent)} .pbar i.hi{background:var(--good)}
.g3 button.ok{outline:4px solid var(--good);outline-offset:2px} .g3 button.no{outline:4px solid var(--bad);outline-offset:2px} .g3 button.dim{opacity:.35}
.btn.mic{gap:10px} .btn.mic svg,.uml .mic svg{width:18px;height:18px}
.btn.mic.on,.uml .mic.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.tile[disabled]{cursor:default}
@media (max-width:420px){.facts b{font-size:1.35rem}.skill{grid-template-columns:minmax(0,1fr) 70px 40px}}
.btn svg{width:18px;height:18px;flex:none}

/* ===== v4: drills, listening, exams, rest state ===== */
.board.rest{background:linear-gradient(160deg,var(--board),color-mix(in srgb,var(--u3) 30%,var(--board)))}
.btn.ghostb{background:transparent;color:var(--board-ink);border-color:color-mix(in srgb,var(--board-ink) 35%,transparent)}
.recc .recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.rec{display:flex;flex-direction:column;gap:6px;background:var(--sunk);border-radius:12px;padding:12px;min-width:0}
.rec.ai{background:color-mix(in srgb,var(--good-bg) 70%,var(--card));border:1px solid var(--good)}
.rec b{font-family:var(--display);font-stretch:108%;font-weight:800}
.fam{display:flex;flex-direction:column;gap:6px}
.dline{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.dline:first-of-type{border-top:0}
.dline p{flex:1;min-width:0;margin:0}
.who{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 .78rem/1 var(--mono);color:#fff;background:var(--u3)}
.who.w1{background:var(--u2)} .who.w2{background:var(--u4)} .who.w3{background:var(--u1)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:.78rem;padding:6px 10px;border-radius:99px;border:1px dashed var(--line);color:var(--mute)}
.badge.on{border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--card));color:var(--ink);font-weight:600}
.cert{border:3px double var(--ink);border-radius:18px;padding:28px 22px;text-align:center;display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,var(--card),color-mix(in srgb,var(--accent) 10%,var(--card)))}
.cert .cl{font:900 4rem/1 var(--display);font-stretch:125%;color:var(--u3)}
.opt.sel{border-color:var(--ink);background:color-mix(in srgb,var(--accent) 18%,var(--card))}
.tk.okk{border-color:var(--good);background:var(--good-bg)} .tk.nok{border-color:var(--bad);background:var(--bad-bg)}
.pool.fix .tk{font-size:1.05rem}
.task{font-weight:600;color:var(--u3)}
.vtalk{min-height:64px;font-size:1rem}
.vtalk span{font-family:var(--body);font-weight:600;font-stretch:100%}
</style>

<script>
/* Wortwerk course data.
   Item format: "German with {answer/wrong1/wrong2}|English". Exactly one brace group per item. */
window.WW_DATA = {
levels: { A1: 'U1', A2: 'U2', B1: 'U3', B2: 'U4' },
stations: [
{ id:'s01', lvl:'A1', name:'Sein & haben', sub:'Present tense basics', g:[
 '*sein*: ich bin, du bist, er/sie ist, wir sind, ihr seid, sie/Sie sind',
 '*haben*: ich habe, du hast, er/sie hat, wir haben, ihr habt, sie/Sie haben',
 'Regular verbs: stem + *-e, -st, -t, -en, -t, -en* → ich wohne, du wohnst, er wohnt',
 'Stems ending in -t/-d add an extra e: er arbeit*e*t' ], items:[
 'Ich {bin/habe/ist} neu in Berlin.|I\'m new in Berlin.',
 '{Hast/Bist/Hat} du heute Zeit?|Do you have time today?',
 'Wir {wohnen/wohnt/wohnst} seit einem Jahr in Hamburg.|We\'ve been living in Hamburg for a year.',
 'Meine Schwester {arbeitet/arbeite/arbeiten} bei einer Bank.|My sister works at a bank.',
 'Woher {kommst/kommt/kommen} du eigentlich?|Where are you actually from?',
 'Ihr {seid/sind/bist} wirklich sehr nett.|You (all) are really very nice.',
 'Er {hat/ist/habt} zwei Kinder und einen Hund.|He has two children and a dog.',
 '{Sprechen/Sprecht/Spricht} Sie Englisch?|Do you speak English? (formal)' ]},
{ id:'s02', lvl:'A1', name:'Der, die, das', sub:'Articles and the accusative', g:[
 'Every noun has a gender: *der* (masc.), *die* (fem.), *das* (neuter). Learn it with the noun.',
 'Accusative (the thing you have, need, see, buy): only masculine changes → *den / einen*',
 'die, das, eine, ein stay the same in the accusative',
 'Ich brauche *einen* Laptop (der) · Ich kaufe *eine* Flasche (die) · Ich nehme *das* Auto' ], items:[
 'Ich brauche {einen/ein/einem} neuen Laptop.|I need a new laptop.',
 'Hast du {den/der/dem} Schlüssel gesehen?|Have you seen the key?',
 '{Die/Der/Das} Wohnung ist klein, aber hell.|The flat is small but bright.',
 'Wir nehmen {das/den/die} Auto, nicht den Bus.|We\'re taking the car, not the bus.',
 'Sie kauft {eine/einen/ein} Flasche Wasser.|She\'s buying a bottle of water.',
 '{Der/Den/Das} Kaffee hier schmeckt super.|The coffee here tastes great.',
 'Ich suche {meinen/mein/meinem} Geldbeutel.|I\'m looking for my wallet.',
 'Kennst du {die/der/den} Frau da drüben?|Do you know the woman over there?' ]},
{ id:'s03', lvl:'A1', name:'Verb auf Platz 2', sub:'Word order and questions', g:[
 'In a statement the conjugated verb is always the *second element*.',
 'Start with time or place and the subject moves behind the verb: *Heute gehe ich* …',
 'W-questions: question word, then verb → *Wann fährt* der Zug?',
 'Yes/no questions start with the verb → *Kommst* du mit?' ], items:[
 'Heute {gehe/gehen/geht} ich früh ins Bett.|Today I\'m going to bed early.',
 'Am Wochenende {besuchen/besucht/besuche} wir meine Eltern.|At the weekend we\'re visiting my parents.',
 '{Wann/Wo/Wer} fährt der nächste Zug nach Köln?|When does the next train to Cologne leave?',
 'Morgen {habe/hat/haben} ich leider keine Zeit.|Tomorrow I unfortunately have no time.',
 '{Warum/Wohin/Wie} lernst du Deutsch?|Why are you learning German?',
 'Nach der Arbeit {trinkt/trinken/trinke} er gern ein Bier.|After work he likes to have a beer.',
 '{Wie/Was/Wo} lange bleibst du in Deutschland?|How long are you staying in Germany?',
 'Jetzt {verstehe/verstehst/versteht} ich das Problem.|Now I understand the problem.' ]},
{ id:'s04', lvl:'A1', name:'Können, müssen, wollen', sub:'Modal verbs', g:[
 'Modal verb in position 2, the other verb as an *infinitive at the very end*.',
 'ich/er forms have no ending: ich *kann*, er *muss*, sie *will*, man *darf*',
 '*möchte* = would like (polite) · *wollen* = want · *dürfen* = be allowed · *sollen* = be supposed to',
 'Ich muss morgen früh *aufstehen*.' ], items:[
 'Ich {muss/musst/müssen} morgen früh aufstehen.|I have to get up early tomorrow.',
 '{Kannst/Kann/Könnt} du mir bitte helfen?|Can you help me please?',
 'Wir wollen am Samstag ins Kino {gehen/geht/gegangen}.|We want to go to the cinema on Saturday.',
 'Hier {darf/muss/will} man nicht rauchen.|You\'re not allowed to smoke here.',
 'Sie {will/wollt/wollen} unbedingt Ärztin werden.|She absolutely wants to become a doctor.',
 'Ich {möchte/möchtest/mögen} einen Tisch für zwei Personen.|I\'d like a table for two.',
 'Du {sollst/soll/sollen} mehr Wasser trinken.|You should drink more water.',
 '{Können/Kann/Könnt} Sie das bitte wiederholen?|Could you repeat that please? (formal)' ]},
{ id:'s05', lvl:'A1', name:'Trennbare Verben', sub:'Separable verbs', g:[
 'Verbs like *aufstehen, anrufen, einkaufen* split: the prefix goes to the end.',
 'Ich *stehe* um sechs *auf*. · Ich *rufe* dich *an*.',
 'With a modal verb they stay together at the end: Ich muss früh *aufstehen*.',
 'Stress is on the prefix: *AN*rufen, *EIN*kaufen, *MIT*kommen' ], items:[
 'Ich stehe jeden Tag um sechs Uhr {auf/an/aus}.|I get up at six every day.',
 'Wann fängt der Film {an/auf/ein}?|When does the film start?',
 'Wir kaufen heute Abend zusammen {ein/an/auf}.|We\'re going shopping together tonight.',
 'Ich rufe dich später {an/auf/zu}.|I\'ll call you later.',
 'Der Zug kommt um halb neun {an/auf/ein}.|The train arrives at half past eight.',
 'Mach bitte das Fenster {zu/an/ein}!|Please close the window!',
 'Kommst du heute Abend {mit/an/zu}?|Are you coming along tonight?',
 'Am Sonntag sehe ich den ganzen Tag {fern/an/auf}.|On Sunday I watch TV all day.' ]},
{ id:'s06', lvl:'A1', name:'Mein, dein, kein', sub:'Possessives and negation', g:[
 '*mein, dein, sein, ihr, unser, euer* take the same endings as ein/eine.',
 '*kein* negates a noun with ein or no article: Ich habe *keine* Zeit.',
 '*nicht* negates everything else: Ich verstehe das *nicht*. Das ist *nicht* mein Problem.',
 'Masculine accusative again: *keinen*, *meinen*, *deinen*' ], items:[
 'Das ist nicht {mein/meine/meinen} Problem.|That\'s not my problem.',
 'Ich habe {keine/kein/nicht} Ahnung.|I have no idea.',
 'Wie heißt {deine/dein/deinen} Freundin?|What\'s your girlfriend\'s name?',
 'Er trinkt {keinen/kein/nicht} Alkohol.|He doesn\'t drink alcohol.',
 'Ich verstehe das {nicht/kein/keine}.|I don\'t understand that.',
 '{Unsere/Unser/Unseren} Nachbarn sind sehr laut.|Our neighbours are very loud.',
 'Wo ist {ihr/ihre/ihren} Büro?|Where is her office?',
 'Wir haben heute {kein/keine/keinen} Brot mehr.|We have no bread left today.' ]},

{ id:'s07', lvl:'A2', name:'Perfekt mit haben', sub:'Talking about the past', g:[
 'Spoken past = *haben* (position 2) + *Partizip II* (end): Ich *habe* Pizza *gegessen*.',
 'Regular: ge-…-t → gemacht, gekauft, gewartet',
 'Strong verbs: ge-…-en, often with a vowel change → gesehen, geschrieben, gegessen',
 'No ge- for verbs on -ieren and with be-, ver-, er-, ent-: studiert, bezahlt, vergessen' ], items:[
 'Ich habe gestern Pizza {gegessen/geesst/essen}.|I ate pizza yesterday.',
 'Was {hast/bist/hat} du am Wochenende gemacht?|What did you do at the weekend?',
 'Wir haben den Film schon {gesehen/gesieht/sehen}.|We\'ve already seen the film.',
 'Sie hat mir eine Nachricht {geschrieben/geschreibt/schreiben}.|She wrote me a message.',
 'Ich habe mein Handy zu Hause {vergessen/vergesst/gevergessen}.|I forgot my phone at home.',
 'Hast du schon {bezahlt/gebezahlt/bezahlen}?|Have you already paid?',
 'Er hat drei Jahre in Wien {studiert/gestudiert/studieren}.|He studied in Vienna for three years.',
 'Wir {haben/sind/hat} lange auf den Bus gewartet.|We waited a long time for the bus.' ]},
{ id:'s08', lvl:'A2', name:'Perfekt mit sein', sub:'Movement and change', g:[
 'Verbs of *movement from A to B* use sein: gegangen, gefahren, gekommen, geflogen',
 'Verbs of *change of state* too: aufgestanden, eingeschlafen, umgezogen, geworden',
 'Plus three to memorise: *geblieben, gewesen, passiert*',
 'Separable verbs put ge- in the middle: an*ge*kommen, auf*ge*standen' ], items:[
 'Ich {bin/habe/ist} gestern nach München gefahren.|I went to Munich yesterday.',
 'Wann bist du heute {aufgestanden/aufgesteht/aufstehen}?|When did you get up today?',
 'Sie {ist/hat/sind} letzte Woche umgezogen.|She moved house last week.',
 'Wir sind bis Mitternacht {geblieben/gebleibt/bleiben}.|We stayed until midnight.',
 'Was ist {passiert/gepassiert/passieren}?|What happened?',
 'Der Zug ist pünktlich {angekommen/angekommt/ankommen}.|The train arrived on time.',
 'Ich bin erst um zwei Uhr {eingeschlafen/eingeschlaft/einschlafen}.|I didn\'t fall asleep until two.',
 '{Seid/Habt/Sind} ihr zu Fuß gegangen?|Did you (all) walk?' ]},
{ id:'s09', lvl:'A2', name:'Der Dativ', sub:'To whom, with whom', g:[
 'Dative articles: *dem* (der/das), *der* (die), *den* + n (plural) · einem, einer',
 'Always dative after: *mit, bei, nach, von, zu, aus, seit*',
 'Pronouns: *mir, dir, ihm, ihr, uns, euch, ihnen/Ihnen*',
 'Dative verbs: *helfen, gehören, danken, gefallen, schmecken* → Ich helfe *dir*.' ], items:[
 'Ich fahre mit {dem/den/der} Fahrrad zur Arbeit.|I ride my bike to work.',
 'Kannst du {mir/mich/ich} das Salz geben?|Can you pass me the salt?',
 'Sie wohnt noch bei {ihren/ihre/ihrer} Eltern.|She still lives with her parents.',
 'Ich helfe {dir/dich/du} gern.|I\'m happy to help you.',
 'Nach {der/die/dem} Schule gehen wir schwimmen.|After school we go swimming.',
 'Das Buch gehört {meinem/meinen/mein} Bruder.|The book belongs to my brother.',
 'Wie geht es {Ihnen/Sie/Ihr}?|How are you? (formal)',
 'Ich komme gerade von {einem/einen/ein} Freund.|I\'m just coming from a friend\'s.' ]},
{ id:'s10', lvl:'A2', name:'Wo oder wohin?', sub:'Two-way prepositions', g:[
 '*in, an, auf, vor, hinter, über, unter, neben, zwischen* take two cases.',
 '*Wo?* (location, no movement) → dative: Die Schlüssel liegen auf *dem* Tisch.',
 '*Wohin?* (direction, movement to) → accusative: Ich lege sie auf *den* Tisch.',
 'Pairs: liegen/legen · stehen/stellen · hängen/hängen · sitzen/setzen' ], items:[
 'Die Schlüssel liegen auf {dem/den/der} Tisch.|The keys are lying on the table.',
 'Ich lege die Schlüssel auf {den/dem/der} Tisch.|I\'m putting the keys on the table.',
 'Wir gehen heute in {die/der/den} Stadt.|We\'re going into town today.',
 'Er arbeitet in {der/die/dem} Stadt.|He works in the city.',
 'Häng das Bild bitte an {die/der/den} Wand.|Please hang the picture on the wall.',
 'Das Auto steht vor {dem/das/den} Haus.|The car is in front of the house.',
 'Stell die Milch in {den/dem/das} Kühlschrank.|Put the milk in the fridge.',
 'Die Katze schläft unter {dem/das/den} Bett.|The cat is sleeping under the bed.' ]},
{ id:'s11', lvl:'A2', name:'Weil & dass', sub:'Subordinate clauses', g:[
 'After *weil, dass, ob* the conjugated verb goes to the *end* of the clause.',
 'Ich bleibe zu Hause, weil ich krank *bin*.',
 '*denn* also means because, but keeps normal word order: …, denn ich *bin* krank.',
 '*ob* = whether/if (for yes/no questions inside a sentence)' ], items:[
 'Ich bleibe zu Hause, weil ich krank {bin/habe/sein}.|I\'m staying home because I\'m ill.',
 'Ich glaube, {dass/weil/ob} er recht hat.|I think that he\'s right.',
 'Sie lernt Deutsch, {weil/dass/denn} sie in Berlin arbeiten will.|She\'s learning German because she wants to work in Berlin.',
 'Schade, dass du nicht kommen {kannst/können/kann}.|Too bad you can\'t come.',
 'Er ist müde, weil er schlecht geschlafen {hat/ist/haben}.|He\'s tired because he slept badly.',
 'Weißt du, {ob/dass/weil} der Supermarkt noch offen ist?|Do you know whether the supermarket is still open?',
 'Ich hoffe, dass wir uns bald {wiedersehen/wiedergesehen/wiedersieht}.|I hope we see each other again soon.',
 'Wir nehmen ein Taxi, {denn/weil/dass} es regnet stark.|We\'re taking a taxi, because it\'s raining hard.' ]},
{ id:'s12', lvl:'A2', name:'Wenn & als', sub:'When and if', g:[
 '*wenn* = if, and when for the present, future, or repeated past events',
 '*als* = when for one single time or period in the past: *Als* ich ein Kind war …',
 '*wann* = when only in questions (direct or indirect)',
 'Clause first? Then the main clause starts with its verb: Wenn ich Zeit habe, *koche* ich.' ], items:[
 '{Wenn/Als/Wann} ich Zeit habe, koche ich gern.|When I have time, I like to cook.',
 '{Als/Wenn/Wann} ich ein Kind war, hatte ich einen Hund.|When I was a child, I had a dog.',
 'Ruf mich an, wenn du angekommen {bist/hast/sein}.|Call me when you\'ve arrived.',
 'Wenn es morgen regnet, {bleiben/bleibt/geblieben} wir zu Hause.|If it rains tomorrow, we\'ll stay home.',
 'Als wir in Rom waren, {haben/sind/hat} wir jeden Tag Pasta gegessen.|When we were in Rome, we ate pasta every day.',
 'Ich weiß nicht, {wann/wenn/als} der Kurs beginnt.|I don\'t know when the course starts.',
 'Immer {wenn/als/wann} ich ihn sehe, lacht er.|Whenever I see him, he\'s laughing.',
 '{Als/Wenn/Ob} sie den Job bekam, war sie überglücklich.|When she got the job, she was overjoyed.' ]},
{ id:'s13', lvl:'A2', name:'Größer, am größten', sub:'Comparing things', g:[
 'Comparative: adjective + *-er* (+ als) · many short ones add an umlaut: größer, älter, kürzer',
 'Superlative: *am …-sten* or der/die/das *…-ste*',
 'Irregular: gut → besser → am besten · gern → lieber → am liebsten · viel → mehr → am meisten',
 'Equal: *genauso … wie* · Unequal: *…-er als*' ], items:[
 'Berlin ist {größer/großer/mehr groß} als München.|Berlin is bigger than Munich.',
 'Das ist der {beste/gutste/besser} Döner der Stadt.|That\'s the best döner in town.',
 'Ich trinke {lieber/gerner/mehr gern} Tee als Kaffee.|I prefer drinking tea to coffee.',
 'Der Zug ist genauso schnell {wie/als/so} das Auto.|The train is just as fast as the car.',
 'Im Winter sind die Tage {kürzer/kurzer/kürzeste}.|In winter the days are shorter.',
 'Sie spricht am {schnellsten/schnellste/schneller} von uns allen.|She speaks the fastest of all of us.',
 'Dieses Handy ist viel {teurer/teuerer/teuer} als meins.|This phone is much more expensive than mine.',
 'Je mehr ich lerne, desto {mehr/viel/meisten} verstehe ich.|The more I learn, the more I understand.' ]},
{ id:'s14', lvl:'A2', name:'Sich freuen', sub:'Reflexive verbs', g:[
 'Reflexive pronouns: *mich, dich, sich, uns, euch, sich*',
 'Common: sich freuen, sich treffen, sich interessieren, sich ärgern, sich entscheiden, sich setzen',
 'If the sentence has another object, use dative *mir/dir*: Ich wasche *mir* die Hände.',
 '*uns/euch/sich* can also mean each other: Wir sehen *uns* morgen.' ], items:[
 'Ich freue {mich/mir/sich} auf das Wochenende.|I\'m looking forward to the weekend.',
 'Wir treffen {uns/sich/euch} um acht vor dem Kino.|We\'re meeting at eight in front of the cinema.',
 'Er interessiert {sich/ihn/ihm} für Geschichte.|He\'s interested in history.',
 'Ich wasche {mir/mich/sich} schnell die Hände.|I\'ll quickly wash my hands.',
 'Hast du {dich/dir/sich} schon entschieden?|Have you decided yet?',
 'Setzen Sie {sich/Sie/Ihnen} bitte!|Please sit down!',
 'Wir haben {uns/sich/wir} lange nicht gesehen.|We haven\'t seen each other in a long time.',
 'Sie ärgert {sich/ihr/sie} über den Lärm.|She\'s annoyed about the noise.' ]},
{ id:'s15', lvl:'A2', name:'War, hatte, konnte', sub:'Simple past of key verbs', g:[
 'For sein, haben and modals Germans use the *Präteritum* even when speaking.',
 '*sein*: ich war, du warst, er war, wir waren, ihr wart, sie waren',
 '*haben*: ich hatte, du hattest, er hatte, wir hatten, ihr hattet, sie hatten',
 'Modals drop the umlaut: *konnte, musste, durfte, wollte, sollte*' ], items:[
 'Gestern {war/wurde/hatte} ich den ganzen Tag im Büro.|Yesterday I was at the office all day.',
 'Wir {hatten/waren/haben} leider keine Zeit.|Unfortunately we had no time.',
 'Als Kind {konnte/könnte/kann} ich gut schwimmen.|As a child I could swim well.',
 'Ich {musste/müsste/muss} gestern bis neun arbeiten.|I had to work until nine yesterday.',
 '{Wart/Waren/Wär} ihr schon mal in Österreich?|Have you (all) ever been to Austria?',
 'Er {wollte/will/wolltet} eigentlich Pilot werden.|He actually wanted to become a pilot.',
 'Wir {durften/dürften/dürfen} als Kinder nicht lange fernsehen.|As kids we weren\'t allowed to watch TV for long.',
 'Wo {warst/wart/bist} du gestern Abend?|Where were you last night?' ]},
{ id:'s16', lvl:'A2', name:'Ein guter Wein', sub:'Adjective endings', g:[
 'After *ein/kein/mein* (nominative): ein gut*er* Wein · eine gut*e* Idee · ein gut*es* Buch',
 'After *der/die/das* (nominative): always *-e* → der alt*e* Mann, die neu*e* Wohnung',
 'Masculine accusative, all dative, all plural after an article: *-en*',
 'No article? The adjective shows the case itself: mit frisch*em* Brot' ], items:[
 'Das ist ein {guter/gute/guten} Wein.|That\'s a good wine.',
 'Ich suche eine {günstige/günstiger/günstigen} Wohnung.|I\'m looking for an affordable flat.',
 'Er hat einen {neuen/neue/neuer} Job gefunden.|He found a new job.',
 'Wir wohnen in einem {kleinen/kleine/kleines} Dorf.|We live in a small village.',
 'Der {alte/alter/alten} Mann füttert die Tauben.|The old man is feeding the pigeons.',
 'Sie trägt ein {rotes/rote/roten} Kleid.|She\'s wearing a red dress.',
 'Mit {frischem/frisches/frischen} Brot schmeckt alles besser.|Everything tastes better with fresh bread.',
 'Die {netten/nette/netter} Nachbarn haben uns eingeladen.|The nice neighbours invited us.' ]},

{ id:'s17', lvl:'B1', name:'Der Mann, der …', sub:'Relative clauses', g:[
 'The relative pronoun takes its *gender from the noun* and its *case from its job* in the clause.',
 'Forms look like articles, except dative plural *denen* and genitive *dessen/deren*.',
 'Verb at the end; a preposition goes before the pronoun: die Frau, *mit der* ich spreche',
 'After alles, etwas, nichts, das Beste use *was*' ], items:[
 'Das ist der Mann, {der/den/dem} nebenan wohnt.|That\'s the man who lives next door.',
 'Der Film, {den/der/dem} wir gesehen haben, war langweilig.|The film we watched was boring.',
 'Die Frau, mit {der/die/dem} ich gesprochen habe, war sehr freundlich.|The woman I spoke with was very friendly.',
 'Das ist das Buch, {das/dass/den} ich dir empfohlen habe.|That\'s the book I recommended to you.',
 'Die Kollegen, {denen/die/den} ich geholfen habe, haben sich bedankt.|The colleagues I helped said thank you.',
 'Ich kenne jemanden, {dessen/deren/der} Vater Pilot ist.|I know someone whose father is a pilot.',
 'Das Haus, in {dem/das/den} sie wohnen, ist sehr alt.|The house they live in is very old.',
 'Alles, {was/das/dass} er sagt, stimmt.|Everything he says is true.' ]},
{ id:'s18', lvl:'B1', name:'Werden', sub:'Future, change and guesses', g:[
 'Futur I: *werden* + infinitive at the end → Ich *werde* dich nie *vergessen*.',
 '*werden*: ich werde, du wirst, er wird, wir werden, ihr werdet, sie werden',
 'On its own it means become/get: Es *wird* dunkel. Sie will Ärztin *werden*.',
 'With *wohl* it is a guess about now: Er *wird wohl* im Stau stehen.' ], items:[
 'Ich {werde/will/wurde} dich nie vergessen.|I will never forget you.',
 'Morgen {wird/will/wirst} es den ganzen Tag regnen.|Tomorrow it will rain all day.',
 'Sie möchte später Lehrerin {werden/sein/bekommen}.|She\'d like to become a teacher later.',
 'Es {wird/ist/bekommt} langsam dunkel.|It\'s slowly getting dark.',
 'Wirst du nächstes Jahr noch hier {wohnen/gewohnt/wohnst}?|Will you still be living here next year?',
 'Er wird wohl noch im Stau {stehen/steht/gestanden}.|He\'s probably still stuck in traffic.',
 'Wir {werden/wollen/wurden} sehen, was passiert.|We\'ll see what happens.',
 'Mein Bruder ist letztes Jahr Vater {geworden/gewesen/bekommen}.|My brother became a father last year.' ]},
{ id:'s19', lvl:'B1', name:'Hätte, wäre, würde', sub:'Konjunktiv II', g:[
 'For wishes, politeness and unreal ifs: *würde* + infinitive for most verbs.',
 'Own forms for the big ones: *wäre, hätte, könnte, müsste, dürfte, sollte, wüsste*',
 'Unreal condition: Wenn ich reich *wäre*, *würde* ich reisen.',
 'Polite: *Könnten* Sie …? · Ich *hätte* gern … · Advice: Du *solltest* …' ], items:[
 'Ich {hätte/habe/hatte} gern einen Kaffee, bitte.|I\'d like a coffee, please.',
 '{Könnten/Konnten/Kannst} Sie mir bitte helfen?|Could you help me please?',
 'Wenn ich reich {wäre/war/würde}, würde ich um die Welt reisen.|If I were rich, I\'d travel around the world.',
 'An deiner Stelle {würde/wurde/werde} ich das nicht machen.|In your place, I wouldn\'t do that.',
 'Wenn ich mehr Zeit {hätte/habe/wäre}, würde ich öfter Sport machen.|If I had more time, I\'d exercise more often.',
 'Du {solltest/sollst/solltet} wirklich zum Arzt gehen.|You really should see a doctor.',
 'Es {wäre/würde/war} schön, wenn du mitkommen könntest.|It\'d be nice if you could come along.',
 '{Dürfte/Darf/Durfte} ich Sie etwas fragen?|Might I ask you something?' ]},
{ id:'s20', lvl:'B1', name:'Es wird gemacht', sub:'The passive', g:[
 'Passive = *werden* + Partizip II: Das Haus *wird renoviert*.',
 'Past: *wurde* + Partizip II · Perfect: ist … Partizip II + *worden* (not geworden)',
 'The doer, if mentioned, comes with *von* + dative: von der Polizei',
 'Used a lot for rules, processes and news: Hier *wird* Deutsch *gesprochen*.' ], items:[
 'Das Haus {wird/ist/hat} gerade renoviert.|The house is being renovated right now.',
 'Hier wird nur Deutsch {gesprochen/sprechen/gesprecht}.|Only German is spoken here.',
 'Das Paket {wurde/wird/war} gestern geliefert.|The parcel was delivered yesterday.',
 'Die Rechnung ist schon bezahlt {worden/geworden/wurde}.|The bill has already been paid.',
 'In Deutschland wird viel Brot {gegessen/geessen/essen}.|A lot of bread is eaten in Germany.',
 'Der Dieb wurde {von/durch/bei} der Polizei gefasst.|The thief was caught by the police.',
 'Wann {wurde/war/hat} diese Kirche gebaut?|When was this church built?',
 'Die Fenster {werden/wird/sind} einmal im Monat geputzt.|The windows are cleaned once a month.' ]},
{ id:'s21', lvl:'B1', name:'Um … zu', sub:'Infinitive clauses', g:[
 'After many verbs and phrases: *zu* + infinitive at the end → Ich habe vergessen, dich *anzurufen*.',
 'Separable verbs take zu in the middle: an*zu*rufen, um*zu*ziehen',
 '*um … zu* = in order to (same subject) · *damit* = so that (different subject)',
 '*ohne … zu* = without doing · *statt … zu* = instead of doing' ], items:[
 'Ich habe vergessen, dich {anzurufen/zu anrufen/anrufen}.|I forgot to call you.',
 'Er lernt Deutsch, {um/damit/für} in Deutschland zu studieren.|He\'s learning German in order to study in Germany.',
 'Es ist nicht leicht, eine Wohnung {zu/um/für} finden.|It isn\'t easy to find a flat.',
 'Hast du Lust, heute Abend essen zu {gehen/geht/gegangen}?|Do you feel like going out to eat tonight?',
 'Sie ist gegangen, {ohne/um/statt} sich zu verabschieden.|She left without saying goodbye.',
 'Ich spare Geld, {damit/um/dass} meine Kinder studieren können.|I\'m saving money so that my kids can go to university.',
 'Wir haben beschlossen, nach Leipzig {umzuziehen/zu umziehen/umziehen}.|We\'ve decided to move to Leipzig.',
 '{Statt/Ohne/Um} zu lernen, hat er den ganzen Tag gespielt.|Instead of studying, he played all day.' ]},
{ id:'s22', lvl:'B1', name:'Der Genitiv', sub:'Of, because of, despite', g:[
 'Genitive articles: *des* + noun-(e)s (der/das) · *der* (die and plural)',
 'It shows possession: das Auto *meines Vaters* · die Meinung *der Kollegen*',
 'Genitive prepositions: *wegen, trotz, während, statt, innerhalb, außerhalb*',
 'Speech often uses von + dative instead; writing prefers the genitive.' ], items:[
 'Das ist das Auto {meines/meinem/meiner} Vaters.|That\'s my father\'s car.',
 '{Wegen/Trotz/Während} des Streiks fahren heute keine Züge.|Because of the strike, no trains are running today.',
 '{Trotz/Wegen/Statt} des Regens sind wir spazieren gegangen.|Despite the rain, we went for a walk.',
 'Während {der/die/dem} Pause trinken wir Kaffee.|During the break we drink coffee.',
 'Am Ende {des/dem/der} Tages war ich total erschöpft.|At the end of the day I was totally exhausted.',
 'Die Meinung {der/den/des} Kollegen ist mir wichtig.|My colleagues\' opinion is important to me.',
 '{Innerhalb/Außerhalb/Während} einer Woche bekommen Sie eine Antwort.|You\'ll get an answer within a week.',
 'Die Miete {dieser/diese/diesem} Wohnung ist viel zu hoch.|The rent of this flat is far too high.' ]},
{ id:'s23', lvl:'B1', name:'Obwohl & trotzdem', sub:'Linking ideas', g:[
 '*obwohl* (although) starts a subordinate clause: verb at the end.',
 '*trotzdem* (nevertheless) and *deshalb* (therefore) are adverbs: the verb comes right after.',
 '*sondern* = but rather, after a negation · *aber* = but',
 '*indem* = by doing · *falls* = in case · *seit* = since (time)' ], items:[
 '{Obwohl/Trotzdem/Weil} es regnet, gehen wir spazieren.|Although it\'s raining, we\'re going for a walk.',
 'Es regnet. {Trotzdem/Obwohl/Deshalb} gehen wir spazieren.|It\'s raining. Nevertheless, we\'re going for a walk.',
 'Ich war krank, {deshalb/trotzdem/weil} bin ich zu Hause geblieben.|I was ill, so I stayed home.',
 'Er hat viel gelernt, {aber/sondern/oder} die Prüfung nicht bestanden.|He studied a lot but didn\'t pass the exam.',
 'Wir fahren nicht ans Meer, {sondern/aber/trotzdem} in die Berge.|We\'re not going to the sea, but to the mountains.',
 'Sie spart Geld, {indem/damit/obwohl} sie selbst kocht.|She saves money by cooking herself.',
 '{Falls/Obwohl/Deshalb} du Hilfe brauchst, sag einfach Bescheid.|In case you need help, just let me know.',
 '{Seit/Bis/Als} ich hier wohne, fahre ich nur noch Fahrrad.|Since I\'ve lived here, I only ride my bike.' ]},
{ id:'s24', lvl:'B1', name:'Es war einmal', sub:'The written past', g:[
 'Stories, news and books use the *Präteritum* instead of the Perfekt.',
 'Regular: stem + *-te* → sagte, spielte, machte (ich and er are identical)',
 'Strong verbs change the vowel and take no ending for ich/er: *ging, kam, gab, blieb, sah*',
 'Mixed: *wusste, dachte, brachte, kannte*' ], items:[
 'Es {war/gab/hatte} einmal ein König, der drei Töchter hatte.|Once upon a time there was a king who had three daughters.',
 'Er {ging/gehte/gang} jeden Morgen zu Fuß zur Arbeit.|He walked to work every morning.',
 'Plötzlich {kam/kommte/kamte} ein Mann ins Zimmer.|Suddenly a man came into the room.',
 'Sie {sagte/sagt/sagtet} kein Wort und verließ das Haus.|She didn\'t say a word and left the house.',
 'Früher {gab/gibt/gebte} es hier einen kleinen Buchladen.|There used to be a small bookshop here.',
 'Ich {wusste/weißte/wisste} nicht, dass du heute Geburtstag hast.|I didn\'t know it\'s your birthday today.',
 'Wir {blieben/bleibten/geblieben} drei Wochen in Portugal.|We stayed in Portugal for three weeks.',
 'Die Kinder {spielten/spielen/gespielt} im Garten, während ich kochte.|The children played in the garden while I cooked.' ]},
{ id:'s25', lvl:'B1', name:'Warten auf', sub:'Verbs with prepositions', g:[
 'Many verbs own a fixed preposition. Learn them as one unit: *warten auf* + accusative.',
 'sich freuen *auf* (ahead) / *über* (now) · denken *an* · sich kümmern *um* · abhängen *von*',
 'Things: *da(r)-* + preposition → dafür, darauf, darüber · Questions: *wo(r)-* → worauf, wofür',
 'People keep the preposition + pronoun: Ich warte *auf ihn*.' ], items:[
 'Ich warte seit einer Stunde {auf/für/an} den Bus.|I\'ve been waiting for the bus for an hour.',
 'Sie hat sich sehr {über/auf/für} das Geschenk gefreut.|She was very happy about the present.',
 '{Worauf/Wofür/Worüber} wartest du?|What are you waiting for?',
 'Ich denke oft {an/über/auf} meine Zeit in Spanien.|I often think of my time in Spain.',
 'Er interessiert sich nicht {dafür/darauf/darüber}.|He isn\'t interested in it.',
 'Kannst du dich {um/für/auf} die Getränke kümmern?|Can you take care of the drinks?',
 'Wir haben lange {über/von/an} das Thema diskutiert.|We discussed the topic for a long time.',
 'Es hängt {vom/am/auf} Wetter ab.|It depends on the weather.' ]},
{ id:'s26', lvl:'B1', name:'Nachdem & bevor', sub:'Sequencing the past', g:[
 'Plusquamperfekt = *hatte / war* + Partizip II: what happened before another past event.',
 '*Nachdem* ich gegessen *hatte*, ging ich spazieren.',
 '*bevor* = before · *sobald* = as soon as · *bis* = until · *während* = while',
 'All of these send the verb to the end of their clause.' ], items:[
 'Nachdem ich gegessen {hatte/habe/war}, bin ich spazieren gegangen.|After I had eaten, I went for a walk.',
 'Als wir ankamen, {war/hatte/ist} der Zug schon abgefahren.|When we arrived, the train had already left.',
 '{Bevor/Nachdem/Während} du gehst, mach bitte das Licht aus.|Before you leave, please turn off the light.',
 'Ich hatte ihn noch nie gesehen, {bevor/nachdem/seit} er bei uns anfing.|I\'d never seen him before he started with us.',
 'Sie war müde, weil sie die ganze Nacht gearbeitet {hatte/war/hat}.|She was tired because she\'d worked all night.',
 '{Nachdem/Bevor/Obwohl} er das Abitur gemacht hatte, zog er nach Berlin.|After he\'d finished his Abitur, he moved to Berlin.',
 '{Sobald/Bevor/Obwohl} ich etwas weiß, melde ich mich.|As soon as I know something, I\'ll get in touch.',
 'Warte hier, {bis/seit/als} ich zurück bin.|Wait here until I\'m back.' ]},

{ id:'s27', lvl:'B2', name:'Hätte ich doch …', sub:'Unreal past', g:[
 'Unreal past = *hätte / wäre* + Partizip II: Wenn ich das *gewusst hätte*, *wäre* ich *gekommen*.',
 'With a modal: hätte + infinitive + modal infinitive → Das *hättest* du *sagen sollen*.',
 'Regret: *Hätte* ich doch nur mehr gelernt!',
 '*als ob* + Konjunktiv II = as if: Er tut so, als ob er alles *wüsste*.' ], items:[
 'Wenn ich das gewusst {hätte/wäre/hatte}, wäre ich früher gekommen.|If I\'d known that, I would have come earlier.',
 'Ich {wäre/hätte/würde} fast zu spät gekommen.|I almost came too late.',
 'Das hättest du mir früher sagen {sollen/gesollt/sollten}.|You should have told me that earlier.',
 'Ohne deine Hilfe {hätte/wäre/habe} ich es nie geschafft.|Without your help I\'d never have made it.',
 'Wenn er schneller gefahren {wäre/hätte/würde}, hätte es einen Unfall gegeben.|If he\'d driven faster, there would have been an accident.',
 'Er tut so, als {ob/dass/wie} er alles wüsste.|He acts as if he knew everything.',
 'Wir hätten den Zug nehmen {können/gekonnt/könnten}.|We could have taken the train.',
 '{Hätte/Wäre/Würde} ich doch nur mehr gelernt!|If only I had studied more!' ]},
{ id:'s28', lvl:'B2', name:'Passiv für Profis', sub:'Advanced passive', g:[
 'With modals: modal + Partizip II + *werden* → Das muss *gelöst werden*.',
 'State passive with *sein* describes a result: Der Laden *ist geschlossen*.',
 'Alternatives: *sich lassen* + infinitive (can be done) · *sein + zu* + infinitive (must/can be done)',
 '*-bar* adjectives: lösbar, machbar, essbar · impersonal: Es *wurde* getanzt.' ], items:[
 'Das Problem muss sofort gelöst {werden/sein/worden}.|The problem must be solved immediately.',
 'Der Laden {ist/wird/hat} sonntags geschlossen.|The shop is closed on Sundays.',
 'Das {lässt/kann/wird} sich leicht erklären.|That can be explained easily.',
 'Die Formulare sind bis Freitag {abzugeben/abgeben/abgegeben}.|The forms are to be handed in by Friday.',
 'Der Fehler konnte nicht gefunden {werden/worden/sein}.|The error couldn\'t be found.',
 'Diese Aufgabe ist kaum {lösbar/gelöst/lösend}.|This task is hardly solvable.',
 'Es {wurde/war/hat} die ganze Nacht getanzt.|There was dancing all night.',
 'Die Gäste müssen rechtzeitig informiert worden {sein/werden/haben}.|The guests must have been informed in time.' ]},
{ id:'s29', lvl:'B2', name:'Er sagte, er habe …', sub:'Reported speech', g:[
 'News and formal writing report speech in *Konjunktiv I*: stem + -e → er *habe*, er *könne*, er *wisse*.',
 '*sein* is irregular: ich sei, er *sei*, sie *seien*',
 'If Konjunktiv I looks like the normal present, switch to Konjunktiv II: ich *hätte*, sie *hätten*',
 'Everyday speech mostly uses the indicative or würde. You need to recognise it, and use it in writing.' ], items:[
 'Der Minister sagte, er {habe/hast/haben} davon nichts gewusst.|The minister said he had known nothing about it.',
 'Sie meint, das {sei/seid/bin} kein Problem.|She says that\'s not a problem.',
 'Die Polizei teilte mit, es {sei/seid/bin} niemand verletzt worden.|The police announced that nobody had been injured.',
 'Er behauptet, er {könne/könnt/kannst} fünf Sprachen sprechen.|He claims he can speak five languages.',
 'Die Firma erklärte, man {werde/wirst/werdet} die Preise nicht erhöhen.|The company stated that it would not raise prices.',
 'Sie fragte, ob ich Zeit {hätte/hast/habt}.|She asked whether I had time.',
 'Der Zeuge sagte, er {wisse/weißt/wisst} nichts davon.|The witness said he knew nothing about it.',
 'In dem Artikel heißt es, die Mieten {seien/sei/seid} stark gestiegen.|The article says rents have risen sharply.' ]},
{ id:'s30', lvl:'B2', name:'Eine Entscheidung treffen', sub:'Noun-verb phrases', g:[
 'Formal German pairs a noun with a fixed verb. The verb cannot be swapped.',
 'eine Entscheidung *treffen* · eine Frage *stellen* · Platz *nehmen* · sich Mühe *geben*',
 'in Frage *kommen* · in Kraft *treten* · Wert *legen* auf · Bescheid *sagen/geben*',
 'They sound natural in emails, meetings and exams.' ], items:[
 'Wir müssen endlich eine Entscheidung {treffen/machen/nehmen}.|We finally have to make a decision.',
 'Das kommt für mich nicht in {Frage/Antwort/Problem}.|That\'s out of the question for me.',
 'Darf ich Ihnen eine Frage {stellen/fragen/legen}?|May I ask you a question?',
 'Bitte nehmen Sie {Platz/Sitz/Stuhl}.|Please take a seat.',
 'Sie hat großen Wert auf Pünktlichkeit {gelegt/gestellt/gemacht}.|She placed great value on punctuality.',
 'Das neue Gesetz tritt im Januar in {Kraft/Macht/Stärke}.|The new law comes into force in January.',
 'Kannst du mir kurz Bescheid {sagen/machen/sprechen}, wenn du da bist?|Can you let me know when you\'re there?',
 'Er hat sich große Mühe {gegeben/getroffen/gestellt}.|He made a great effort.' ]},
{ id:'s31', lvl:'B2', name:'Sowohl … als auch', sub:'Two-part connectors', g:[
 '*sowohl … als auch* = both … and · *weder … noch* = neither … nor',
 '*entweder … oder* = either … or · *nicht nur … sondern auch* = not only … but also',
 '*zwar … aber* = admittedly … but · *einerseits … andererseits* = on one hand … on the other',
 '*je* + comparative (verb last), *desto* + comparative (verb next)' ], items:[
 'Sie spricht {sowohl/weder/entweder} Deutsch als auch Französisch.|She speaks both German and French.',
 'Ich habe weder Zeit {noch/oder/als} Lust.|I have neither time nor desire.',
 'Entweder wir fahren jetzt, {oder/noch/sondern} wir bleiben ganz zu Hause.|Either we leave now, or we stay home altogether.',
 'Je länger ich hier wohne, {desto/als/so} besser gefällt es mir.|The longer I live here, the more I like it.',
 'Er ist {zwar/sowohl/weder} nett, aber nicht sehr zuverlässig.|He\'s nice, admittedly, but not very reliable.',
 'Sie ist nicht nur klug, {sondern/aber/als} auch witzig.|She\'s not only smart but also funny.',
 'Einerseits will ich reisen, {andererseits/außerdem/trotzdem} muss ich sparen.|On the one hand I want to travel, on the other I need to save.',
 '{Weder/Entweder/Sowohl} der Chef noch die Kollegen wussten davon.|Neither the boss nor the colleagues knew about it.' ]},
{ id:'s32', lvl:'B2', name:'Die steigenden Preise', sub:'Participles as adjectives', g:[
 'Partizip I (infinitive + *d*) = happening now, active: die steigen*d*en Preise',
 'Partizip II = finished or passive: das *bestellte* Essen, die *verletzte* Spielerin',
 'Both take normal adjective endings and can become nouns: die Reisenden',
 'Partizip I without an ending works as an adverb: Er hörte *schweigend* zu.' ], items:[
 'Die {steigenden/steigende/steigen} Preise machen vielen Menschen Sorgen.|The rising prices worry many people.',
 'Das {bestellte/bestellende/bestellt} Essen ist nie angekommen.|The food that was ordered never arrived.',
 'Ein {bellender/gebellter/bellen} Hund hat mich geweckt.|A barking dog woke me up.',
 'Bitte füllen Sie das {beigefügte/beifügende/beigefügt} Formular aus.|Please fill in the attached form.',
 'Die {verletzte/verletzende/verletzt} Spielerin wurde ins Krankenhaus gebracht.|The injured player was taken to hospital.',
 'Er hörte {schweigend/geschwiegen/schweigt} zu.|He listened in silence.',
 'Die neu {eröffnete/eröffnende/eröffnen} Bäckerei ist immer voll.|The newly opened bakery is always full.',
 'Alle {Reisenden/Gereisten/Reisen} werden gebeten auszusteigen.|All passengers are requested to get off.' ]},
{ id:'s33', lvl:'B2', name:'Aufgrund des Wetters', sub:'Formal noun style', g:[
 'Formal German packs clauses into nouns: weil das Wetter schlecht war → *aufgrund* des schlechten Wetters',
 'Genitive prepositions: *aufgrund, infolge, angesichts, mithilfe, anstelle, laut*',
 'Verb → noun: entwickeln → die *Entwicklung* · verbessern → die *Verbesserung* · abschließen → der *Abschluss*',
 'Set phrases: *bei Bedarf* · *nach Abschluss* · *zur Verbesserung*' ], items:[
 '{Aufgrund/Trotz/Anhand} des schlechten Wetters wurde das Konzert abgesagt.|Due to the bad weather the concert was cancelled.',
 '{Mithilfe/Infolge/Angesichts} einer App lerne ich jeden Tag neue Wörter.|With the help of an app I learn new words every day.',
 'Nach {Abschluss/Schluss/Abschließen} des Studiums zog sie ins Ausland.|After completing her degree she moved abroad.',
 '{Angesichts/Mithilfe/Anstelle} der hohen Kosten wurde das Projekt gestoppt.|In view of the high costs the project was stopped.',
 'Die {Entwicklung/Entwickeln/Entwickelte} neuer Medikamente dauert viele Jahre.|The development of new drugs takes many years.',
 'Bei {Bedarf/Brauchen/Not} können Sie mich jederzeit anrufen.|If needed, you can call me anytime.',

 '{Laut/Wegen/Dank} einer Studie schlafen die Deutschen zu wenig.|According to a study, Germans sleep too little.' ]},

s01: { lesson: `## Two verbs you need in every sentence
*sein* (to be) and *haben* (to have) are irregular. You will use them thousands of times, so learn them as a chant.
| ich bin | ich habe |
| du bist | du hast |
| er / sie / es ist | er / sie / es hat |
| wir sind | wir haben |
| ihr seid | ihr habt |
| sie / Sie sind | sie / Sie haben |
> Ich bin müde. = I am tired.
> Wir haben Hunger. = We are hungry. (literally: we have hunger)
! German uses *haben* for hunger, thirst and fear: Hunger haben, Durst haben, Angst haben.
? Du {bist/bin/ist} sehr nett. = You are very nice.
? Er {hat/habt/hast} ein Auto. = He has a car.
---
## Regular verbs: stem + ending
Take the infinitive (*wohnen*), remove *-en* to get the stem (*wohn-*), then add the ending for the person.
| ich wohn*e* | wir wohn*en* |
| du wohn*st* | ihr wohn*t* |
| er wohn*t* | sie / Sie wohn*en* |
> Ich wohne in Köln. = I live in Cologne.
> Wo wohnst du? = Where do you live?
! *wir*, *sie* (they) and *Sie* (formal you) always look like the infinitive.
? Wir {spielen/spielt/spielst} Fußball. = We play football.
? Du {lernst/lernt/lernen} Deutsch. = You are learning German.
---
## Small spelling rules
Stems ending in *-t* or *-d* add an *e* so you can pronounce it: du arbeit*e*st, er find*e*t.
Some strong verbs change their vowel for *du* and *er/sie/es*: fahren → du f*ä*hrst, sprechen → er spr*i*cht, lesen → sie l*ie*st.
> Er arbeitet viel. = He works a lot.
> Sie spricht drei Sprachen. = She speaks three languages.
? Sie {arbeitet/arbeitt/arbeiten} in Berlin. = She works in Berlin.
? Er {fährt/fahrt/fahren} nach Hause. = He's driving home.`,

s02: { lesson: `## Every noun has a gender
German nouns are masculine (*der*), feminine (*die*) or neuter (*das*). The gender is often not logical: *das Mädchen* (the girl) is neuter. So you learn every noun together with its article, never alone.
| der Tisch (m) | die Lampe (f) | das Buch (n) |
| ein Tisch | eine Lampe | ein Buch |
! In this app, nouns are coloured: *blue = der*, *red = die*, *green = das*. Your memory will start to link colour and word.
? {Die/Der/Das} Lampe ist neu. = The lamp is new.
---
## Patterns that help
Some endings tell you the gender almost always:
| die: -ung, -heit, -keit, -schaft, -ion, -tät | die Zeitung, die Freiheit, die Information |
| das: -chen, -lein, -ment, -um | das Mädchen, das Dokument, das Zentrum |
| der: days, months, seasons, -er for people | der Montag, der Mai, der Lehrer |
? {Die/Der/Das} Wohnung ist groß. = The flat is big.
---
## The accusative: the thing you have, need or see
When a noun is the *direct object* (what you have, need, buy, see), it is in the accusative. Good news: only *masculine* changes.
| der → *den* | ein → *einen* | kein → *keinen* |
| die, das, plural stay the same | | |
> Ich brauche einen Stift. = I need a pen. (der Stift)
> Ich sehe die Frau. = I see the woman.
? Ich habe {einen/ein/eine} Bruder. = I have a brother.
? Wir kaufen {den/der/dem} Tisch. = We're buying the table.`,

s03: { lesson: `## The verb is always number two
In a German statement the conjugated verb sits in *position 2*. Position 1 can be the subject, but also a time, a place or an object.
| Ich | *gehe* | heute ins Kino. |
| Heute | *gehe* | ich ins Kino. |
| Ins Kino | *gehe* | ich heute. |
! When something else takes position 1, the subject jumps behind the verb. This is the single most important rule of German word order.
? Morgen {fahre/fahren/fährt} ich nach Hamburg. = Tomorrow I'm going to Hamburg.
---
## W-questions
Question word in position 1, verb in position 2.
| wer = who | was = what | wo = where |
| wohin = where to | woher = where from | wann = when |
| warum = why | wie = how | wie viel = how much |
> Wo wohnst du? = Where do you live?
> Wann beginnt der Kurs? = When does the course start?
? {Woher/Wohin/Wo} kommst du? = Where are you from?
---
## Yes/no questions
Put the verb first.
> Kommst du mit? = Are you coming along?
> Hast du Zeit? = Do you have time?
! Answer a negative question with *doch* when you mean "yes": Kommst du nicht? *Doch!* (Yes, I am!)

s04: { lesson: `## A modal verb + an infinitive at the end
Modal verbs change the meaning of another verb. The modal goes in position 2, the main verb goes to the *very end* in the infinitive.
> Ich *kann* gut *schwimmen*. = I can swim well.
> Wir *müssen* jetzt *gehen*. = We have to go now.
? Ich muss heute {arbeiten/arbeite/arbeitet}. = I have to work today.
---
## The six modals
| können = can | müssen = must, have to |
| wollen = want | dürfen = may, be allowed |
| sollen = should, be supposed to | mögen / möchte = like / would like |
Their *ich* and *er* forms are identical and have no ending, and most change their vowel in the singular:
| ich kann, du kannst, er kann | ich muss, du musst, er muss |
| ich will, du willst, er will | ich darf, du darfst, er darf |
? Er {kann/kannt/könnt} nicht schwimmen. = He can't swim.
? Du {darfst/darf/dürfst} hier parken. = You're allowed to park here.
---
## Polite and careful
*möchte* is the polite "would like". Use it in shops and restaurants.
> Ich möchte einen Kaffee. = I'd like a coffee.
! *muss nicht* means "don't have to", not "must not". "Must not" is *darf nicht*.
? Du {musst/darfst/willst} nicht kommen, wenn du keine Zeit hast. = You don't have to come if you have no time.`,

s05: { lesson: `## Verbs that split in two
Many verbs have a small prefix: *an*rufen, *auf*stehen, *ein*kaufen, *mit*kommen, *fern*sehen. In a normal sentence the prefix breaks off and goes to the *end*.
> Ich *rufe* dich morgen *an*. = I'll call you tomorrow.
> Wann *stehst* du *auf*? = When do you get up?
? Ich kaufe heute {ein/an/auf}. = I'm going shopping today.
---
## Which prefixes split?
| split (stressed) | an, auf, aus, ein, mit, vor, zu, zurück, fern, los, weg |
| never split | be-, ver-, er-, ent-, ge-, zer-, emp-, miss- |
> Ich verstehe das. = I understand that. (ver- never splits)
> Ich stehe um sechs auf. = I get up at six.
? Ich {verstehe/stehe ver/verstehe ver} dich nicht. = I don't understand you.
---
## Together again
With a modal verb, or after *dass/weil*, the verb sits at the end and stays in one piece.
> Ich muss früh *aufstehen*. = I have to get up early.
> …, weil ich früh *aufstehe*. = …because I get up early.
? Kannst du mich morgen {anrufen/rufen an/anrufst}? = Can you call me tomorrow?`,

s06: { lesson: `## My, your, his, her
Possessives take the same endings as *ein*.
| ich → mein | wir → unser |
| du → dein | ihr → euer |
| er/es → sein | sie (they) → ihr |
| sie (she) → ihr | Sie (formal) → Ihr |
> Das ist mein Bruder und meine Schwester. = That's my brother and my sister.
? Wie alt ist {deine/dein/deinen} Tochter? = How old is your daughter?
---
## kein: "no / not a"
Use *kein* to negate a noun that would have *ein* or no article.
> Ich habe ein Auto. → Ich habe *kein* Auto.
> Ich habe Zeit. → Ich habe *keine* Zeit.
Masculine accusative again takes *-en*: Ich habe *keinen* Hunger.
? Wir haben {keine/kein/nicht} Kinder. = We don't have children.
---
## nicht: everything else
*nicht* negates verbs, adjectives, names, and nouns with *der/die/das* or a possessive.
> Ich komme *nicht*. = I'm not coming.
> Das ist *nicht* mein Handy. = That's not my phone.
! Rough rule: *nicht* goes at the end, but before adjectives, places and the second verb part: Ich gehe heute *nicht* ins Kino.
? Das Essen ist {nicht/kein/keine} gut. = The food isn't good.`,

s07: { lesson: `## How Germans talk about the past
In speech Germans mostly use the *Perfekt*: a helper verb (*haben* or *sein*) in position 2, and the *past participle* at the end.
> Ich *habe* Pizza *gegessen*. = I ate pizza. / I have eaten pizza.
! Same structure as modal verbs: two parts, the second one at the end.
? Wir haben gestern Tennis {gespielt/spielen/gespielen}. = We played tennis yesterday.
---
## Regular participles: ge- … -t
| machen → *ge*mach*t* | kaufen → *ge*kauf*t* |
| arbeiten → *ge*arbeit*et* | spielen → *ge*spiel*t* |
? Was hast du {gekauft/gekaufen/kaufte}? = What did you buy?
---
## Strong participles: ge- … -en
Many common verbs end in *-en* and often change their vowel. Learn them with the verb.
| sehen → gesehen | essen → gegessen | trinken → getrunken |
| schreiben → geschrieben | nehmen → genommen | finden → gefunden |
! No *ge-* for verbs ending in *-ieren* (studiert, telefoniert) or starting with *be-, ver-, er-, ent-* (bezahlt, verstanden).
? Hast du den Brief {geschrieben/geschreibt/schreiben}? = Did you write the letter?
? Ich habe alles {verstanden/geverstanden/verstehen}. = I understood everything.`,

s08: { lesson: `## When the helper is sein
A small group of verbs builds the Perfekt with *sein* instead of *haben*. They have one thing in common: no direct object, and they describe *movement from A to B* or a *change of state*.
| movement | gehen → ist gegangen, fahren → ist gefahren, fliegen → ist geflogen, kommen → ist gekommen |
| change | aufstehen → ist aufgestanden, einschlafen → ist eingeschlafen, werden → ist geworden, sterben → ist gestorben |
> Ich *bin* nach Berlin *gefahren*. = I went to Berlin.
? Wir {sind/haben/ist} nach Spanien geflogen. = We flew to Spain.
---
## Three to memorise
These use *sein* even though nothing moves: *sein* (ist gewesen), *bleiben* (ist geblieben), *passieren* (ist passiert).
> Ich *bin* zu Hause *geblieben*. = I stayed home.
> Was *ist passiert*? = What happened?
? Er {ist/hat/sind} krank gewesen. = He was ill.
---
## Separable verbs
*ge-* goes between prefix and verb: an*ge*kommen, auf*ge*standen, ein*ge*kauft, mit*ge*bracht.
? Der Zug ist schon {abgefahren/geabfahren/abfahren}. = The train has already left.`,
items: [
'Wir {sind/haben/seid} gestern ins Kino gegangen.|We went to the cinema yesterday.',
'Er ist mit dem Fahrrad zur Arbeit {gefahren/gefahrt/fahren}.|He rode his bike to work.',
'Wann {bist/hast/ist} du nach Hause gekommen?|When did you come home?',
'Meine Oma ist letztes Jahr {gestorben/gesterbt/sterben}.|My grandma died last year.',
